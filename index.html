<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5b7a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نتائج الشبان">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <title>مجمع مدارس الشبان المسلمين ببنها | نظام النتائج المتطور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link id="fontAwesomeCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script>
    // Robust icon loading: jsDelivr first, cdnjs fallback. No SRI mismatch can blank the icon font.
    (function(){
      var l=document.getElementById("fontAwesomeCss");
      if(!l) return;
      l.addEventListener("error",function(){
        if(l.dataset.fallback) return;
        l.dataset.fallback="1";
        l.href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css";
      });
    })();
  </script>
  <!-- XLSX وSupabase وChart.js: تُحمَّل في نهاية الصفحة لتقليل الحجب؛ XLSX ديناميكي للأدمن فقط -->
  <style>


    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: linear-gradient(135deg, #eef2f7 0%, #e4eaf1 100%);
      --surface: #ffffff;
      --surface2: #f8fafc;
      --surface3: #f1f5f9;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --primary: #0f5b7a;
      --primary-dark: #0a3d54;
      --primary-light: #2c7da0;
      --primary-glow: rgba(15,91,122,0.08);
      --accent: #d4a259;
      --accent-dark: #b8863a;
      --accent-light: #fef5e8;
      --success: #2e7d64;
      --success-light: #e6f4ef;
      --danger: #c44536;
      --danger-light: #fdefec;
      --warning: #e68a2e;
      --warning-light: #fef3e8;
      --text: #1e2a3a;
      --text2: #475569;
      --text3: #94a3b8;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px -12px rgba(0,0,0,0.15);
      --radius: 1.25rem;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    body.dark {
      --bg: linear-gradient(135deg, #0f1a24 0%, #0a1118 100%);
      --surface: #1a2a38;
      --surface2: #152230;
      --surface3: #0f1a24;
      --border: #2d3a48;
      --border2: #3a4a5a;
      --primary: #3b8db0;
      --primary-dark: #2c6d8a;
      --primary-light: #5aa9c9;
      --accent: #e6bc7e;
      --accent-dark: #d4a95a;
      --accent-light: #2a2a1e;
      --success: #3b9b82;
      --success-light: #1e3a30;
      --danger: #d97a68;
      --danger-light: #3a2a25;
      --text: #e2e8f0;
      --text2: #a0b3c9;
      --text3: #6b7d95;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem 1rem calc(5rem + var(--safe-bottom));
      padding-top: calc(1rem + var(--safe-top));
    }

    .school-emblem-header {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .emblem-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      width: 90px;
      height: 90px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .emblem-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
      padding: 4px;
      pointer-events: none;
    }

    .emblem-center { text-align: center; flex: 1; }
    .emblem-title { font-size: clamp(1rem, 2.5vw, 1.4rem); font-weight: 900; color: var(--primary); letter-spacing: 0.5px; }
    .emblem-subtitle { font-size: 0.82rem; color: var(--accent-dark); font-weight: 700; margin-top: 0.2rem; }

    .topbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 1.5rem; gap: 0.8rem; }
    .icon-btn {
      border-radius: 40px; border: 1px solid var(--border); background: var(--surface); color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; font-weight: 600; font-family: 'Cairo', sans-serif;
      min-height: 44px; width: 44px; height: 44px; font-size: 1rem;
    }
    .icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    .hero { text-align: center; margin: 0.5rem 0 1.5rem; }
    .hero-badge {
      display: inline-flex; background: var(--accent-light); color: var(--accent-dark);
      border-radius: 100px; padding: 0.3rem 1.1rem; font-size: 0.72rem; font-weight: 700; gap: 0.4rem; margin-bottom: 0.8rem;
    }
    .hero-title { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 800; line-height: 1.3; }
    .hero-title span {
      background: linear-gradient(125deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-desc { color: var(--text3); font-weight: 500; font-size: 0.87rem; margin-top: 0.4rem; }

    .search-card {
      background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1rem;
    }
    .search-label {
      font-weight: 700; font-size: 0.85rem; color: var(--text2);
      margin-bottom: 0.6rem; display: flex; gap: 0.5rem; align-items: center;
    }
    .search-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
    .search-input, .search-select {
      flex: 1; background: var(--surface2); border: 2px solid var(--border); border-radius: 60px;
      padding: 0.85rem 1.2rem; font-size: 1rem; font-weight: 500; font-family: 'Cairo', sans-serif;
      color: var(--text); min-height: 50px; -webkit-appearance: none; appearance: none;
    }
    .search-input { text-align: center; font-family: monospace; letter-spacing: 1.5px; }
    .search-input:focus, .search-select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); outline: none;
    }
    .search-btn {
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: none; border-radius: 60px; padding: 0 1.5rem; font-weight: 700; color: white;
      cursor: pointer; display: flex; gap: 0.5rem; align-items: center;
      font-family: 'Cairo', sans-serif; font-size: 0.95rem; min-height: 50px; white-space: nowrap; flex-shrink: 0;
    }

    .result-card {
      background: var(--surface); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-lg); margin-top: 1.5rem; border: 1px solid var(--border);
      max-width: 720px; margin-left: auto; margin-right: auto;
    }

    /* ===== تخطيط التقرير الاسترشادي =====
       ترويسة → صورة يسار + 6 كروت (2×3) → درجات 3 أعمدة → رسم بياني → ختم */
    .report-student-section {
      padding: 0.7rem 0.9rem 0.35rem;
    }
    .report-student-section > .section-heading { margin-bottom: 0.55rem; }
    /* صف الصورة+الكروت: صورة رأسية (3:4) يسار + كروت يمين بارتفاع متساوٍ */
    .report-student-row {
      display: grid;
      grid-template-columns: minmax(100px, 0.95fr) 1.1fr 1.1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 0.45rem;
      margin: 0;
      align-items: stretch;
      direction: ltr;
    }
    .report-student-grid {
      display: contents;
      background: transparent;
      padding: 0;
      border: none;
    }
    .report-student-item {
      display: flex;
      flex-direction: column;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.45rem 0.55rem;
      min-height: 0;
      justify-content: center;
      min-width: 0;
      direction: rtl;
      text-align: right;
    }
    .report-student-item .label {
      font-size: 0.58rem; font-weight: 700; color: var(--text3);
      letter-spacing: 0.2px;
      margin-bottom: 0.1rem;
    }
    .report-student-item .value {
      font-size: 0.82rem; font-weight: 800; color: var(--text); margin-top: 1px;
      word-break: break-word;
    }
    .report-student-item .value.ltr {
      direction: ltr; font-family: monospace; letter-spacing: 0.4px; font-size: 0.78rem;
      text-align: left;
    }
    /* الصورة رأسية 3:4 — عرضها ≈ عرض كارت، وارتفاعها يحدد ارتفاع الصفوف الثلاثة */
    .report-photo-area {
      grid-column: 1;
      grid-row: 1 / span 3;
      width: 100%;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.3rem;
      align-self: start;
    }
    .report-photo-frame {
      width: 100%;
      aspect-ratio: 3 / 4;
      height: auto;
      min-height: 0;
      border: 2.5px solid var(--primary);
      border-radius: 14px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
      flex: 0 0 auto;
    }
    .report-photo-frame .photo-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      color: var(--text3); font-size: 0.62rem; font-weight: 600;
    }
    .report-photo-frame .photo-placeholder i { font-size: 1.8rem; }
    .student-photo-preview {
      width: 100%; height: 100%; object-fit: cover;
      display: none; position: absolute; inset: 0;
    }
    .student-photo-preview.has-img { display: block; }
    .report-photo-frame.has-img .photo-placeholder { display: none; }
    .student-photo-actions {
      display: flex; flex-direction: column; gap: 0.25rem; width: 100%;
      flex: 0 0 auto;
    }
    .student-photo-actions .action-btn {
      font-size: 0.65rem; padding: 0.25rem 0.4rem; width: 100%;
      justify-content: center;
    }
    .student-photo-hint {
      font-size: 0.58rem; color: var(--text3); text-align: center; line-height: 1.3;
      flex: 0 0 auto;
    }
    .student-photo-box { display: contents; }

    @media screen and (max-width: 520px) {
      .report-student-row {
        grid-template-columns: 1fr 1fr;
        direction: rtl;
      }
      .report-photo-area {
        grid-column: 1 / -1;
        grid-row: auto;
        max-width: 100%;
        margin: 0 auto 0.55rem;
        width: 100%;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 0.4rem !important;
        height: auto !important;
        overflow: visible !important;
      }
      .report-photo-frame {
        flex: none;
        width: min(150px, 42vw);
        max-width: 150px;
        aspect-ratio: 3 / 4;
        height: auto;
      }
      /* أزرار كاميرا / معرض / استعراض ظاهرة وواضحة على الموبايل */
      .student-photo-actions {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
        gap: 0.35rem !important;
        width: 100% !important;
        max-width: 100% !important;
        visibility: visible !important;
        opacity: 1 !important;
        height: auto !important;
        overflow: visible !important;
      }
      .student-photo-actions .action-btn,
      .student-photo-actions .photo-src-btn {
        display: inline-flex !important;
        visibility: visible !important;
        font-size: 0.72rem !important;
        padding: 0.4rem 0.55rem !important;
        width: auto !important;
        min-width: 28% !important;
        flex: 1 1 auto !important;
        justify-content: center !important;
      }
      .student-photo-hint {
        display: block !important;
        width: 100% !important;
        text-align: center !important;
      }
    }

    /* ترويسة التقرير — صندوق مستدير كما في المخطط الاسترشادي */
    .result-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.75rem 1rem;
      margin: 0.85rem 0.9rem 0;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      background: var(--surface2);
      color: var(--text);
      box-sizing: border-box;
      width: calc(100% - 1.8rem);
    }
    .result-header-emblem {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
      box-shadow: 0 1px 4px rgba(15, 91, 122, 0.08);
    }
    .result-header-emblem img { width: 100%; height: 100%; object-fit: contain; padding: 2px; }
    .result-header-emblem i { font-size: 1.7rem; color: var(--accent); }
    .result-title-group {
      text-align: center; flex: 1; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.12rem;
    }
    .result-school-name {
      font-size: 1.05rem; font-weight: 900; color: var(--primary); letter-spacing: 0.2px;
      line-height: 1.35;
    }
    .result-school-sub {
      font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-top: 0;
      line-height: 1.3;
    }
    .result-term-line {
      font-size: 0.78rem; font-weight: 800; color: var(--primary);
      margin-top: 0.1rem; line-height: 1.3;
    }
    /* توافق قديم — الشارة الجانبية لم تعد مستخدمة في الترويسة الجديدة */
    .result-term-badge { display: none; }
    .result-term { display: none; }
    @media screen and (max-width: 520px) {
      .result-header-emblem { width: 48px; height: 48px; }
      .result-school-name { font-size: 0.88rem; }
      .result-school-sub, .result-term-line { font-size: 0.68rem; }
    }

    .basic-data-section { padding: 0; background: transparent; border-bottom: none; }
    .section-heading {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 0.9rem; font-weight: 700; font-size: 0.83rem; color: var(--primary);
    }
    .section-heading i { font-size: 1rem; color: var(--accent); }
    .section-heading::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

    .basic-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
    @media (min-width: 600px) { .basic-info-grid { grid-template-columns: repeat(3, 1fr); } }

    .info-card { background: var(--surface); border-radius: 14px; padding: 0.75rem; border: 1px solid var(--border); text-align: center; }
    .info-label { font-size: 0.63rem; color: var(--text3); font-weight: 600; display: block; }
    .info-value { font-weight: 800; font-size: 0.88rem; margin-top: 0.25rem; color: var(--text); display: block; word-break: break-word; }

    .status-badge { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 30px; font-size: 0.72rem; font-weight: 700; }
    .status-available { background: var(--success-light); color: var(--success); }
    .status-not-available { background: var(--danger-light); color: var(--danger); }

    .result-details-section { padding: 0.55rem 0.9rem 0.35rem; }
    .grades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); column-gap: 0.45rem; row-gap: 0.7rem; }
    .grade-item {
      background: var(--surface2); border-radius: 10px; padding: 0.45rem 0.55rem;
      display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
      gap: 0.35rem; min-width: 0;
    }
    .grade-name { font-weight: 600; font-size: 0.72rem; color: var(--text2); min-width: 0; }
    .grade-score { font-weight: 800; padding: 0.14rem 0.5rem; border-radius: 30px; font-size: 0.68rem; flex-shrink: 0; }
    .score-high { background: var(--success-light); color: var(--success); }
    .score-mid { background: var(--warning-light); color: var(--warning); }
    .score-low { background: var(--danger-light); color: var(--danger); }
    .score-text { background: var(--surface3); color: var(--text2); }
    .score-empty { background: var(--surface3); color: var(--text3); }

    /* كارت حالة النتيجة (ناجح / دور ثانٍ) — بعد المواد وقبل الرسم */
    .result-outcome-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0.55rem 0.9rem 0.35rem;
      padding: 0.7rem 1rem;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1.45;
      text-align: center;
      border: 1.5px solid transparent;
      box-sizing: border-box;
      width: calc(100% - 1.8rem);
      max-width: 100%;
    }
    .result-outcome-banner i { font-size: 1.15rem; flex-shrink: 0; }
    .result-outcome-banner.outcome-pass {
      background: var(--success-light);
      color: var(--success);
      border-color: rgba(46, 125, 100, 0.35);
    }
    .result-outcome-banner.outcome-second {
      background: var(--danger-light);
      color: var(--danger);
      border-color: rgba(196, 69, 54, 0.35);
    }
    .result-outcome-banner.outcome-neutral {
      background: var(--surface2);
      color: var(--text2);
      border-color: var(--border);
    }

    .subjects-chart-section {
      text-align: center;
      margin: 0.6rem 0.9rem 0.5rem;
      padding: 0.9rem 1rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      background: var(--surface2);
    }
    .subjects-chart-section .section-heading { margin-bottom: 0.5rem; font-size: 1rem; }
    .grade-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.45rem 1rem; margin: 0.35rem 0 0.7rem; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 600; color: var(--text2); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .legend-action { font-size: 0.72rem; font-weight: 500; color: var(--text3); }
    .grade-level-action { line-height: 1.25; }

    /* ========== بيان درجات رسمي (rpt-*) ========== */
    .rpt-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      max-width: 780px;
      margin: 1.5rem auto 0;
      direction: rtl;
    }
    .rpt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: none;
      background: linear-gradient(135deg, #0f5b7a 0%, #0a3d54 100%);
      color: #fff;
    }
    .rpt-header-emblem {
      width: 58px; height: 58px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.45);
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .rpt-header-emblem img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
    .rpt-header-emblem i { font-size: 1.5rem; color: var(--accent); }
    .rpt-header-text { text-align: center; flex: 1; min-width: 0; }
    .rpt-school-name {
      font-size: clamp(1.05rem, 2.6vw, 1.28rem);
      font-weight: 900; color: #fff; line-height: 1.35;
    }
    .rpt-school-motto {
      font-size: 0.88rem; font-weight: 800; color: #f0d9a8; margin-top: 0.12rem;
    }
    .rpt-term-title {
      font-size: 0.92rem; font-weight: 900; color: #e8f4fa; margin-top: 0.22rem;
    }

    /* صورة + 6 كروت — الصورة دائمًا في اليسار البصري */
    .rpt-student {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      align-items: start;
      direction: ltr;
    }
    .rpt-student > .rpt-photo-col { order: 1; }
    .rpt-student > .rpt-cards-grid { order: 2; }
    .rpt-photo-col {
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    }
    .rpt-photo-frame {
      width: 110px; aspect-ratio: 3/4;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: var(--surface2);
      overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .rpt-photo-frame .photo-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      color: var(--text3); font-size: 0.62rem; font-weight: 600;
    }
    .rpt-photo-frame .photo-placeholder i { font-size: 1.6rem; }
    .rpt-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, auto);
      gap: 0.4rem;
      direction: rtl;
    }
    .rpt-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem 0.55rem;
      display: flex; flex-direction: column; justify-content: center;
      min-height: 48px;
    }
    .rpt-card-label {
      font-size: 0.72rem; font-weight: 800; color: var(--text3);
      margin-bottom: 0.14rem;
    }
    .rpt-card-value {
      font-size: 0.92rem; font-weight: 900; color: var(--text);
      word-break: break-word; line-height: 1.35;
    }
    .rpt-card-value.ltr { direction: ltr; font-family: monospace; letter-spacing: 0.4px; text-align: left; font-size: 0.88rem; }
    .rpt-card-result { font-size: 0.85rem; }

    /* جدول المواد */
    .rpt-subjects { padding: 0.35rem 1rem 0.55rem; }
    .rpt-section-title {
      display: flex; align-items: center; gap: 0.45rem;
      font-weight: 900; font-size: 1rem; color: var(--primary);
      margin-bottom: 0.45rem;
    }
    .rpt-section-title i { color: var(--accent); }
    .rpt-table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .rpt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .rpt-table thead th {
      background: var(--surface3);
      color: var(--text2);
      font-weight: 900;
      padding: 0.5rem 0.55rem;
      border-bottom: 1.5px solid var(--border2);
      text-align: center;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .rpt-table tbody td {
      padding: 0.42rem 0.55rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-weight: 700;
    }
    .rpt-table tbody tr:last-child td { border-bottom: none; }
    .rpt-table tbody tr:nth-child(even) { background: var(--surface2); }
    .rpt-table .col-subject { text-align: right; font-weight: 700; color: var(--text); width: 42%; }
    .rpt-table .col-max { text-align: center; font-weight: 600; color: var(--text2); width: 14%; }
    .rpt-table .col-score { text-align: center; width: 18%; }
    .rpt-table .col-est { text-align: center; width: 26%; }
    .score-pill {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: normal;
      font-family: 'Cairo', sans-serif;
    }
    .est-label {
      font-weight: 900; font-size: 0.88rem;
      letter-spacing: normal !important;
      font-family: 'Cairo', sans-serif;
      white-space: nowrap;
    }
    .est-action { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text3); margin-top: 1px; letter-spacing: normal; }
    .rpt-sum-value, .rpt-status, .rpt-card-value, .rpt-table td, .rpt-table th {
      letter-spacing: normal !important;
      font-family: 'Cairo', sans-serif;
    }
    .rpt-empty { text-align: center; color: var(--text3); padding: 1rem !important; }
    .row-exempt td { color: var(--text3); font-style: italic; }

    /* الملخص والحالة */
    .rpt-summary {
      margin: 0.35rem 1rem 0.55rem;
      padding: 0.7rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
    }
    .rpt-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }
    .rpt-sum-item {
      text-align: center;
      padding: 0.35rem 0.25rem;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .rpt-sum-label {
      display: block;
      font-size: 0.75rem; font-weight: 800; color: var(--text3);
      margin-bottom: 0.15rem;
    }
    .rpt-sum-value {
      display: block;
      font-size: 1.08rem; font-weight: 900; color: var(--text);
    }
    .rpt-status {
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      font-weight: 900; font-size: 1rem;
      text-align: center;
      border: 1.5px solid transparent;
    }
    .rpt-status.outcome-pass {
      background: var(--success-light); color: var(--success);
      border-color: rgba(46, 125, 100, 0.3);
    }
    .rpt-status.outcome-second {
      background: var(--danger-light); color: var(--danger);
      border-color: rgba(196, 69, 54, 0.3);
    }
    .rpt-status.outcome-neutral {
      background: var(--surface); color: var(--text2);
      border-color: var(--border);
    }
    .rpt-elem-note {
      text-align: center; font-size: 0.75rem; font-weight: 600;
      color: var(--text2); margin-top: 0.4rem;
    }

    /* الرسم البياني */
    .rpt-chart.chart-container {
      margin: 0.35rem 1rem 0.55rem;
      padding: 0.7rem 0.85rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
    }
    .chart-wrap {
      position: relative;
      width: 100%;
      margin: 0 auto;
      height: 280px;
      min-height: 180px;
      direction: ltr;
    }

    /* التوقيع والختم — الختم والاعتماد في اليسار */
    .rpt-signature.signature-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin: 0.4rem 1rem 0.5rem;
      padding-top: 0.5rem;
      direction: ltr; /* الختم يسار، التاريخ يمين */
    }
    .rpt-stamp-block { display: none; } /* شاشة فقط — يظهر في الطباعة */
    .rpt-stamp-circle {
      width: 78px; height: 78px; border-radius: 50%;
      border: 2px dashed var(--primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .rpt-stamp-line { font-weight: 900; font-size: 0.88rem; }
    .rpt-stamp-sub { font-weight: 700; font-size: 0.72rem; margin-top: 2px; }
    .rpt-print-date {
      font-size: 0.88rem; font-weight: 700; color: var(--text3);
      margin: 0;
      direction: rtl;
    }

    @media screen and (max-width: 560px) {
      .rpt-student {
        grid-template-columns: 1fr;
        direction: rtl;
      }
      .rpt-photo-col { order: -1; margin: 0 auto 0.4rem; }
      .rpt-photo-frame { width: 100px; }
      .rpt-cards-grid { grid-template-columns: 1fr 1fr; }
      .rpt-summary-grid { grid-template-columns: 1fr; }
      .rpt-table { font-size: 0.72rem; }
      .rpt-table .col-est { width: 22%; }
    }

    .not-available-message {
      background: var(--danger-light); margin: 0 1.2rem 1.2rem; padding: 0.9rem 1rem; border-radius: 12px;
      text-align: center; display: flex; flex-direction: column; gap: 0.45rem;
    }
    .not-available-note {
      color: var(--danger); font-weight: 700; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .not-available-apology {
      color: var(--text2); font-weight: 500; font-size: 0.76rem;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }

    .action-buttons {
      display: flex; gap: 0.8rem; justify-content: center; padding: 1rem 1.2rem 1.2rem;
      border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .action-btn {
      background: var(--surface2); border: 1px solid var(--border); padding: 0.55rem 1.2rem; border-radius: 40px;
      font-weight: 600; cursor: pointer; display: inline-flex; gap: 0.5rem; align-items: center;
      color: var(--text2); font-size: 0.82rem; font-family: 'Cairo', sans-serif; min-height: 44px;
    }
    .action-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    .toast-container {
      position: fixed; bottom: calc(2rem + var(--safe-bottom)); left: 50%; transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem; align-items: center; width: calc(100% - 2rem); max-width: 500px; pointer-events: none;
    }
    .toast {
      background: var(--surface); border-radius: 60px; padding: 0.65rem 1.3rem; font-weight: 600; font-size: 0.82rem;
      border-right: 4px solid var(--success); box-shadow: var(--shadow); pointer-events: auto; text-align: center; width: 100%;
    }
    .toast.err { border-right-color: var(--danger); }

    .theme-toggle-fixed {
      position: fixed; bottom: calc(1.5rem + var(--safe-bottom)); left: calc(1.5rem + var(--safe-left));
      background: var(--surface); border-radius: 60px; padding: 0.75rem; box-shadow: var(--shadow);
      cursor: pointer; z-index: 90; border: 1px solid var(--border); min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-box, .admin-panel {
      background: var(--surface); border-radius: 24px; border: 1px solid var(--border);
      max-width: 780px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem;
    }
    .modal-input, .modal-select {
      width: 100%; padding: 0.75rem 1.2rem; border-radius: 40px; border: 1.5px solid var(--border);
      background: var(--surface2); color: var(--text); font-family: 'Cairo', sans-serif; font-size: 0.95rem; outline: none; min-height: 46px;
    }
    .admin-section-title {
      font-weight: 700; font-size: 0.82rem; color: var(--text2); margin: 1.2rem 0 0.6rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .btn {
      border-radius: 40px; border: none; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700;
      padding: 0.55rem 1.1rem; font-size: 0.82rem; display: inline-flex; gap: 0.4rem; align-items: center; min-height: 40px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
    .btn-warning { background: var(--warning); color: white; }

    .upload-zone {
      border: 2px dashed var(--border2); border-radius: 16px; padding: 1.2rem; text-align: center; cursor: pointer; background: var(--surface2); margin-bottom: 0.5rem;
    }
    .student-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); max-height: 250px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { background: var(--surface3); color: var(--text2); font-weight: 700; padding: 0.6rem 0.8rem; position: sticky; top: 0; z-index: 1; }
    td { padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border); color: var(--text); }


    
  

/* ================================================================
   MODERN A4 TRANSCRIPT — redesign v2
   ثابت: الرأس، الصورة، 6 كروت، إطار الرسم، التوقيع والختم
   ديناميكي: بيانات الطالب، المواد، الدرجات، المجموع، الرسم
   ================================================================ */
:root {
  --report-navy: #0b4767;
  --report-navy-2: #083650;
  --report-gold: #c9963e;
  --report-ink: #162536;
  --report-muted: #667789;
  --report-line: #cbd5df;
  --report-soft: #f5f8fb;
  --report-green: #2b8a57;
}

.rpt-sheet.modern-report {
  width: min(100%, 210mm);
  max-width: 210mm;
  margin: 1.2rem auto 2rem;
  background: #fff;
  border: 1px solid #d5dde5;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(11,71,103,.10);
  color: var(--report-ink);
  direction: rtl;
  font-family: 'Cairo', sans-serif;
}

.modern-report .rpt-header {
  position: relative;
  display: grid;
  grid-template-columns: 58px 1fr 58px;
  align-items: center;
  gap: 10px;

  background: #ffffff !important;
  color: var(--report-ink) !important;
  border-bottom: 1px solid var(--report-line) !important;
}
.modern-report .rpt-header::after {
  content: '';
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 7px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--report-gold) 18%, var(--report-gold) 82%, transparent);
}
.modern-report .rpt-header-emblem {
  width: 52px; height: 52px;

  background: #fff;
  border: 1px solid #d6dee7;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.modern-report .rpt-header-emblem {
  width: 58px !important;
  height: 58px !important;
  max-width: 58px !important;
  max-height: 58px !important;
  overflow: hidden !important;
  flex-shrink: 0 !important;
}
.modern-report .rpt-header-emblem img {
  width: 100% !important;

.modern-report .rpt-header-text { text-align: center; min-width: 0; }

.modern-report .rpt-student {

.modern-report .rpt-photo-col { order: 1; display:flex; flex-direction:column; align-items:center; }
.modern-report .rpt-photo-frame {

.modern-report .rpt-photo-frame .student-photo-preview {

}
.modern-report .rpt-photo-frame .student-photo-preview.has-img { display:block; }
.modern-report .rpt-photo-frame .photo-placeholder { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#9aa8b6; }

.modern-report .rpt-card-value.ltr { direction:ltr; text-align:right; font-family:'Cairo',sans-serif; letter-spacing:0; }

.modern-report .rpt-card.status-card .rpt-card-value { color: #1f8a5b; font-weight: 800; }

/* أزرار الصورة تظهر على الشاشة فقط — تُخفى عند الطباعة عبر 
.modern-report .student-photo-hint {
  display: block !important;

.modern-report .rpt-table tbody tr:nth-child(even) { background:#f8fafc; }
.modern-report .rpt-table .col-subject { text-align:right; width:43%; color:var(--report-ink); }
.modern-report .rpt-table .col-max { width:14%; color:#526476; }
.modern-report .rpt-table .col-score { width:18%; }
.modern-report .rpt-table .col-est { width:25%; }
.modern-report .score-pill { background:transparent !important; padding:0; font-size:1.05rem; font-weight:900; }

.modern-report .rpt-chart .rpt-section-title::after { content:''; width:46px; height:2px; background:var(--report-gold); display:block; }

.modern-report .rpt-stamp-circle img { display: none !important; } /* لا شعار داخل الختم */
.modern-report .rpt-stamp-line { font-size:.55rem; font-weight:900; }
.modern-report .rpt-stamp-sub { font-size:.48rem; font-weight:700; }

.modern-report .rpt-signature-label { font-size:.7rem; font-weight:900; color:var(--report-navy); }

.modern-report .rpt-print-date {

/* أزرار الطباعة وواتساب تظهر على الشاشة — تُخفى فقط عند الطباعة */

}

@media screen and (max-width: 720px) {
  .rpt-sheet.modern-report { border-radius:0; margin:0; }
  .modern-report .rpt-header { grid-template-columns:52px 1fr 52px; padding:12px 10px 10px; }
  .modern-report .rpt-header-emblem { width:50px; height:50px; }

  .modern-report .rpt-card { min-height:52px; padding:7px 8px; }

  .modern-report .rpt-subjects, .modern-report .rpt-chart, .modern-report .rpt-summary { margin-left:10px; margin-right:10px; }
  .modern-report .rpt-table { font-size:.72rem; }
  .modern-report .rpt-table thead th { font-size:.68rem; padding:6px 5px; }
  .modern-report .rpt-table tbody td { padding:6px 5px; }
  .modern-report .rpt-summary-grid { grid-template-columns:1fr; }
  .modern-report .rpt-sum-item { border-left:0; border-bottom:1px solid var(--report-line); }
  .modern-report .rpt-sum-item:last-child { border-bottom:0; }
  .modern-report .rpt-signature.signature-section { margin:0 10px 12px; }
}



  
/* ================================================================
   MODERN A4 TRANSCRIPT — visual refinement v2.1
   الهدف: مطابقة النموذج المرجعي بصريًا مع الحفاظ على كل منطق النظام.
   ================================================================ */
.modern-report {
  --v2-navy:#0a496b;
  --v2-navy-dark:#083b57;
  --v2-gold:#c9973f;
  --v2-line:#c8d1da;
  --v2-soft:#f7f9fb;
  --v2-green:#2b8a57;
}
.modern-report.rpt-sheet{
  max-width:210mm;
  width:100%;
  margin:18px auto 28px;
  border:1px solid #cfd8e1;
  border-radius:16px;
  box-shadow:0 10px 28px rgba(8,59,87,.10);
  background:#fff;
}
.modern-report .rpt-header{
  grid-template-columns:72px 1fr 72px;
  gap:14px;
  padding:16px 22px 17px;
  border-bottom:0;
  background:#fff;
}
.modern-report .rpt-header::after{
  left:22px; right:22px; bottom:7px; height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--v2-gold) 18%,var(--v2-gold) 82%,transparent 100%);
}
.modern-report .rpt-header-emblem{
  width:68px;height:68px;border-radius:8px;
  border:0;background:#fff;box-shadow:none;
}
.modern-report .rpt-header-emblem img{padding:0;object-fit:contain}
.modern-report .rpt-school-name{font-size:1.55rem;color:var(--v2-navy);line-height:1.25}
.modern-report .rpt-school-motto{font-size:.86rem;color:var(--v2-gold);margin-top:3px}
.modern-report .rpt-term-title{font-size:1.04rem;color:var(--v2-navy);margin-top:7px}

.modern-report .rpt-student{
  grid-template-columns:39mm 1fr;
  gap:5mm;
  padding:13px 20px 14px;
}
.modern-report .rpt-photo-frame{
  width:37mm;height:49.5mm;
  border:1.5px solid var(--v2-navy);
  border-radius:10px;
  background:#f5f8fb;
}
.modern-report .rpt-cards-grid{gap:7px}
.modern-report .rpt-card{
  min-height:56px;
  padding:8px 11px;
  border:1px solid var(--v2-line);
  border-radius:9px;
  background:#fff;
}
.modern-report .rpt-card-label{font-size:.68rem;color:#667789;margin-bottom:2px}
.modern-report .rpt-card-value{font-size:.91rem;line-height:1.3;color:#162536}
.modern-report .rpt-card-result{font-size:.82rem}
.modern-report .rpt-card.status-card .rpt-card-value{color:var(--v2-green)}

.modern-report .rpt-section-title{
  min-width:150px;
  padding:5px 27px;
  margin:0 auto 8px;
  border-radius:18px;
  background:var(--v2-navy);
  font-size:.88rem;
  box-shadow:none;
}
.modern-report .rpt-subjects{padding:0 20px 10px}
.modern-report .rpt-subjects-label{
  font-size:.72rem;font-weight:800;color:var(--v2-navy,#0a496b);
  margin:0 0 6px;padding:0 2px;
}
.modern-report .rpt-subjects-label.extra-label{color:#667789}
/* خلفية خفيفة لمواد المجموع */
.modern-report .subjects-counted .rpt-table tbody tr.row-counted{
  background:#f0f7fb;
}
.modern-report .subjects-counted .rpt-table tbody tr.row-counted:nth-child(even){
  background:#e8f2f8;
}
.modern-report .subjects-extra .rpt-table tbody tr{
  background:#fafbfc;
}
/* كروت المواد — مخفية على الشاشة؛ تظهر في الطباعة فقط عند has-many-subjects */
.modern-report .rpt-subjects-cards{display:none}
.modern-report .subjects-extra .extra-cards{display:none}
.modern-report .rpt-table-wrap{
  border:1px solid var(--v2-line);
  border-radius:8px;
  overflow:hidden;
}
.modern-report .rpt-table{font-size:.84rem;table-layout:fixed}
.modern-report .rpt-table thead th{
  background:var(--v2-navy);
  color:#fff;
  padding:7px 7px;
  font-size:.79rem;
  height:31px;
}
.modern-report .rpt-table tbody td{
  padding:5.5px 7px;
  height:30px;
  border-bottom:1px solid #e2e7ec;
  font-weight:700;
}
.modern-report .rpt-table .col-num{width:7%;text-align:center;color:#526476}
.modern-report .rpt-table .col-subject{width:39%;text-align:right;color:#162536}
.modern-report .rpt-table .col-subject .subject-icon{
  color:var(--v2-navy,#0a496b);
  margin-left:6px;
  font-size:.85em;
  opacity:.85;
  width:1.1em;
  text-align:center;
  display:inline-block;
}
.modern-report .rpt-table .col-subject .subject-name{vertical-align:middle}
.modern-report .rpt-table .col-max{width:16%;text-align:center;color:#526476}
.modern-report .rpt-table .col-score{width:17%;text-align:center}
.modern-report .rpt-table .col-est{width:21%;text-align:center}
.modern-report .rpt-table .score-pill{font-size:.86rem}
.modern-report .rpt-table .est-label{font-size:.82rem}
.modern-report .rpt-table .est-action{font-size:.62rem}

.modern-report .rpt-summary{
  margin:4px 20px 8px;
  padding:0;
  border:1px solid var(--v2-line);
  border-radius:9px;
  overflow:visible;
  background:#fff;
  box-sizing:border-box;
}
/* كارتان فقط: المجموع | النسبة */
.modern-report .rpt-summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  margin:0;
  direction:rtl;
}

  grid-template-columns:1.15fr 1fr 1fr;
}
.modern-report .rpt-sum-item{
  min-height:64px;padding:10px 14px;
  border:0;border-left:1px solid var(--v2-line);border-radius:0;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;
  position:relative;
}
.modern-report .rpt-sum-item:last-child{border-left:0}
.modern-report .rpt-sum-total{background:var(--v2-navy);color:#fff}
.modern-report .rpt-sum-total .rpt-sum-label{color:#dbeaf2}
.modern-report .rpt-sum-total .rpt-sum-value{color:#fff;font-size:1.35rem;font-weight:900}
.modern-report .rpt-sum-total .rpt-sum-icon{color:rgba(255,255,255,.85);position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
.modern-report .rpt-sum-pct .rpt-sum-value{color:var(--v2-navy);font-size:1.28rem;font-weight:900}
.modern-report .rpt-sum-band{display:block;font-size:.78rem;font-weight:800;color:var(--v2-gold);margin-top:2px}
.modern-report .rpt-sum-label{font-size:.7rem;color:#667789;margin-bottom:2px;font-weight:700}
.modern-report .rpt-sum-value{font-size:1.16rem;color:var(--v2-navy);line-height:1.25}
.modern-report .rpt-sum-status.outcome-pass{background:#f0faf4}
.modern-report .rpt-sum-status.outcome-pass .rpt-status-text{color:#1f8a5b;font-weight:900;font-size:.92rem}
.modern-report .rpt-sum-status.outcome-second{background:#fff8e8}
.modern-report .rpt-sum-status.outcome-second .rpt-status-text{color:#b45309;font-weight:900;font-size:.92rem}
.modern-report .rpt-sum-status .rpt-sum-check{margin-top:4px;font-size:1.25rem;color:#fff!important;background:#22a35a!important;border:none!important;width:36px;height:36px}
.modern-report .rpt-sum-status.outcome-second .rpt-sum-check{color:#fff!important;background:#c44536!important}
.modern-report .rpt-sum-status .rpt-sum-check i{color:#fff!important}
.modern-report .rpt-status{font-size:.82rem;padding:7px 10px;border-top:1px solid var(--v2-line)}
.modern-report .rpt-flex-zone{
  margin:0 16px 14px;padding:12px;border:1.5px dashed #d0dae6;border-radius:12px;min-height:48px;background:#fafbfc;
}
.modern-report .rpt-flex-zone.has-extra{border-style:solid;background:#fff}
.modern-report .extra-print-grid{display:grid;gap:8px;direction:rtl}
.modern-report .extra-print-grid.extra-cols-2{grid-template-columns:1fr 1fr 1fr}
.modern-report .extra-print-grid.extra-cols-3{grid-template-columns:1fr 1fr 1fr}
.modern-report .extra-print-grid .subject-card{
  display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;
  padding:12px 12px;min-height:48px;border:1px solid #d8e0e8;border-radius:10px;background:#f8fafc;font-size:.88rem;font-weight:700;
}
@media screen and (max-width:720px){

/* ================================================================
   STABLE HTML GRADE CHART — works on screen, print and PDF without Canvas
   ================================================================ */
.modern-report .rpt-html-chart{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:5px;
  direction:ltr;
}
.modern-report .rpt-chart-row{
  display:grid;
  grid-template-columns:46px minmax(0,1fr) 145px;
  align-items:center;
  gap:8px;
  min-height:18px;
  direction:ltr;
}
.modern-report .rpt-chart-value{
  font-size:11px;
  font-weight:800;
  color:#29425a;

  white-space:nowrap;

.modern-report .rpt-chart-track{

  background:#edf1f4;

}
.modern-report .rpt-chart-bar{

}
/* تنويه التربية الدينية: محاذاة مستقرة على كامل عرض التقرير */
.modern-report .rpt-notice{
  width:calc(100% - 40px);
  margin:0 20px 10px !important;
  box-sizing:border-box;
  display:grid !important;
  grid-template-columns:22px minmax(0,1fr);
  align-items:center;
  column-gap:7px;
  direction:rtl;
  text-align:right;
  overflow:visible !important;

// ===== تحميل مكتبة XLSX ديناميكيًا (للأدمن فقط) =====
const XLSX_SCRIPT_URL = "https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js";
// SRI: قيمة integrity الصحيحة لهذا الإصدار بالتحديد. اتركها فارغة مؤقتًا إلى
// أن يتم توليدها فعليًا (لا يجوز اختلاق قيمة عشوائية هنا — أي قيمة خاطئة
// ستمنع تحميل المكتبة بالكامل لأن المتصفح سيرفض الملف عند عدم تطابق الهاش).
// طريقة توليدها (مرة واحدة فقط، من أي جهاز بمتصفح):
//   1) افتح صفحة النظام وسجّل دخول كأدمن (لتشغيل التحميل التلقائي للمكتبة)
//      أو نفّذ يدويًا: ensureXlsxLoaded()
//   2) افتح Console (F12) — ستظهر رسالة تبدأ بـ "[XLSX SRI]" تحتوي القيمة
//      الجاهزة بصيغة integrity="sha384-...".
//   3) انسخها والصقها هنا في XLSX_SCRIPT_INTEGRITY، ثم احفظ الملف.
// (أو من الطرفية: curl -s <XLSX_SCRIPT_URL> | openssl dgst -sha384 -binary | openssl base64 -A)
const XLSX_SCRIPT_INTEGRITY = "sha384-gx12pQMMYnabkTgbCHqqrT65RwDnXI/f/dU2H9JUmT0KUeiMF5bf+yroQBmX0Nuk";

let xlsxLoadPromise = null;

// يحسب هاش SHA-384 لمحتوى الملف الفعلي المُحمَّل ويطبعه في الـ Console بصيغة
// integrity جاهزة للّصق — بديل آمن عن اختلاق قيمة SRI بدون التأكد منها.
async function logXlsxIntegrityHint(scriptText) {
  try {
    const digest = await crypto.subtle.digest("SHA-384", new TextEncoder().encode(scriptText));
    const b64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
    console.info(`[XLSX SRI] integrity="sha384-${b64}"`);
  } catch (e) { /* لو subtle.digest غير متاح (سياق غير آمن مثلاً)، تجاهل بصمت */ }
}

function ensureXlsxLoaded() {
  if (typeof XLSX !== "undefined") return Promise.resolve();
  if (xlsxLoadPromise) return xlsxLoadPromise;

  xlsxLoadPromise = (async () => {
    if (XLSX_SCRIPT_INTEGRITY) {
      // القيمة الصحيحة متوفرة: نستخدم وسم <script> عادي مع integrity، والمتصفح
      // نفسه يرفض تنفيذ الملف تلقائيًا لو الهاش لم يتطابق (حماية SRI حقيقية).
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = XLSX_SCRIPT_URL;
        s.crossOrigin = "anonymous";
        s.integrity = XLSX_SCRIPT_INTEGRITY;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("تعذّر تحميل مكتبة Excel (فشل التحقق SRI أو تعذّر الاتصال بالـCDN)"));
        document.head.appendChild(s);
      });
    } else {
      // لم يتم توليد قيمة SRI بعد: نحمّل المكتبة عبر fetch حتى نتمكن من حساب
      // الهاش الفعلي وطباعته للأدمن (راجع التعليق أعلاه)، ثم ننفّذها.
      const res = await fetch(XLSX_SCRIPT_URL, { mode: "cors" });
      if (!res.ok) throw new Error("تعذّر تحميل مكتبة Excel");
      const text = await res.text();
      logXlsxIntegrityHint(text);
      const s = document.createElement("script");
      s.text = text;
      document.head.appendChild(s);
    }
  })();

  xlsxLoadPromise = xlsxLoadPromise.catch(err => { xlsxLoadPromise = null; throw err; });
  return xlsxLoadPromise;
}


// ---------- إعدادات الهوية (الشعارات واسم المدرسة) — مزامنة سحابية ----------
// قبل إضافة هذا الجزء، كانت appSettings (الشعار واسم المدرسة) بتتخزن على
// IndexedDB بتاع كل جهاز/متصفح لوحده فقط، فلو الأدمن غيّرها من جهاز، الجهاز
// التاني كان لسه شايف النسخة القديمة المحفوظة عنده محلياً. دلوقتي بنقرأ/بنكتب
// نفس الإعدادات في جدول app_settings على Supabase عشان تتوحّد على كل الأجهزة.
const APP_SETTINGS_TABLE = "app_settings";
const APP_SETTINGS_ROW_ID = "main";

async function fetchAppSettingsFromCloud() {

  try {
    const { data, error } = await supabaseClient

const CLOUD_CHUNK_SIZE = 500; // حجم الدفعة لكل نداء upsert

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

// يحوّل ملف إكسيل لمصفوفة سجلات جاهزة للرفع السحابي — بنفس تخطيط
// الأعمدة المستخدم في processExcelFile بالضبط، بدون لمس studentsDB المحلية.

/** استخراج نص الحالة النهائية من صف إكسيل:
 * 1) عمود عنوانه نتيجة / الحالة النهائية
 * 2) آخر عمود إذا كان نص نتيجة (ناجح/منقول/…) وليس درجة رقمية
 */
/** عمود الاسم بالإنجليزية (اختياري) — يُقرأ كبيان للطالب ولا يُعدّ مادة ولا نتيجة */
const EN_NAME_HEADER_RE = /^(english\s*name|name\s*_?en(glish)?|الاسم\s*(ب|بال)ا?[إا]نجليز(ي|ية)?)$/i;
function findEnglishNameIndex(headers) {
  for (let i = 0; i < headers.length; i++) {
    if (EN_NAME_HEADER_RE.test(String(headers[i] || "").trim())) return i;
  }
  return -1;
}
/** مفتاح محجوز داخل subjects لتخزين الاسم الإنجليزي بدون تغيير بنية قاعدة البيانات */
const NAME_EN_KEY = "__name_en";
/** الاسم الإنجليزي يُحفظ أيضًا بجانب الاسم العربي في حقل الاسم (عربي | English) ليصل حتى لو لم تُعرض المواد */
const NAME_SEP = " | ";
function arabicNameOf(row) { return String((row && row.name) || "").split(NAME_SEP)[0].trim(); }

function extractResultColumnFromExcelRow(headers, row) {
  const _enIdx = findEnglishNameIndex(headers);
  const isOutcomeVal = (v) => /ناجح|منقول|دور\s*ثان|رسوب|راسب|اجتاز|مقبول|التمنيات|نجاح/.test(String(v || ""));
  const isPureNumber = (v) => /^\d+([.,]\d+)?$/.test(String(v || "").trim());
  // من اليمين لليسار: أولوية لعمود بعنوان نتيجة
  for (let i = headers.length - 1; i >= 0; i--) {
    const h = String(headers[i] || "").trim();
    if (/^(نتيجة|النتيجة|الحالة\s*النهائية|result|outcome)$/i.test(h) || /نتيجة\s*الطالب|الحالة\s*النهائية/.test(h)) {
      const v = String(row[i] != null ? row[i] : "").trim();
      if (v) return { value: v, index: i };
    }
  }
  // آخر عمود (بعد الأعمدة الأساسية) إن كان نص حالة وليس رقم درجة
  let lastIdx = headers.length - 1;
  if (lastIdx === _enIdx) lastIdx--;
  if (lastIdx >= 6) {
    const v = String(row[lastIdx] != null ? row[lastIdx] : "").trim();
    if (v && !isPureNumber(v) && (isOutcomeVal(v) || !/^\d/.test(v))) {
      return { value: v, index: lastIdx };
    }
  }
  // ابحث في كل الأعمدة بعد السادس عن قيمة تشبه النتيجة
  for (let i = headers.length - 1; i >= 6; i--) {
    if (i === _enIdx) continue;
    const v = String(row[i] != null ? row[i] : "").trim();
    if (v && isOutcomeVal(v)) return { value: v, index: i };
  }
  return { value: "", index: -1 };
}

async function parseExcelRecords(file) {
  await ensureXlsxLoaded();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(`تعذرت قراءة الملف: ${file.name}`));
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows || rows.length < 2) throw new Error(`ملف فارغ أو غير صالح: ${file.name}`);

        const headers = rows[0].map((h) => String(h || "").trim());
        const enIdx = findEnglishNameIndex(headers);
        const records = [];

        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (!row || !row.length) continue;

          let nid = row[0];
          if (!nid && nid !== 0) continue;
          nid = String(nid).trim().replace(/[^0-9]/g, "");
          if (nid.length < 10) continue;

          // هيكل الأعمدة:
          // 1 الرقم القومي | 2 الحالة (موقف النشر) | 3 الصف | 4 الاسم | 5 رقم الجلوس | 6 نوع النتيجة
          // ثم المواد … ثم العمود الأخير = نتيجة (للبانر: ناجح ومنقول… / دور ثانٍ…)
          const statusCol = row[1] ? String(row[1]).trim() : "";
          const grade = row[2] ? String(row[2]).trim() : "";
          const name = row[3] ? String(row[3]).trim() : "طالب";
          const seatNumber = row[4] ? String(row[4]).trim() : "";
          const resultType = row[5] ? String(row[5]).trim() : "";
          const lastIdx = headers.length - 1;
          // استخراج عمود النتيجة بذكاء (عنوان «نتيجة» أو آخر عمود نصي)
          const extracted = extractResultColumnFromExcelRow(headers, row);
          const resultColumn1 = extracted.value;
          const resultColIdx = extracted.index;
          const isAvailable = statusCol === "متاح" || statusCol === "متاحة"
            || resultType === "متاح" || resultType === "متاحة";

          // المواد: من العمود 7 مع استبعاد عمود النتيجة المستخرج
          const subjects = {};
          let subjectOrder = 0;
          const subjectEnd = headers.length;
          for (let ci = 6; ci < subjectEnd; ci++) {
            if (ci === resultColIdx || ci === enIdx) continue; // لا تُدرج عمود النتيجة/الاسم الإنجليزي ضمن المواد
            const h = headers[ci];
            if (h && h.trim() && row[ci] !== undefined && row[ci] !== null && String(row[ci]).trim() !== "") {
              const cell = parseCellValue(row[ci]);
              cell.order = subjectOrder++;
              const detectedMax = extractSubjectMaxFromHeader(h);
              if (detectedMax) cell.max = detectedMax;
              subjects[h] = cell;
            }
          }

          const nameEn = enIdx >= 0 && row[enIdx] ? String(row[enIdx]).replace(/\s+/g, " ").trim() : "";
          if (nameEn) subjects[NAME_EN_KEY] = nameEn;

          records.push({
            national_id: nid, name, name_en: nameEn, seat_number: seatNumber, grade,
            result_column1: resultColumn1, result_type: resultType,
            status_text: statusCol, is_available: isAvailable, subjects,
          });
        }
        resolve(records);
      } catch (err) { reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}

// يرفع دفعة سجلات لفترة واحدة على Supabase، ويرجع { added, updated }
async function pushRecordsToSupabase(records, termKey, fileId) {
  let added = 0, updated = 0;

  for (const batch of chunkArray(records, CLOUD_CHUNK_SIZE)) {
    const nids = batch.map((r) => r.national_id);

    const { data: existing, error: existErr } = await supabaseClient
      .from("students").select("national_id, seat_number, grade").in("national_id", nids);
    if (existErr) throw existErr;
    const existingMap = new Map((existing || []).map((s) => [s.national_id, s]));
    const existingSet = new Set(existingMap.keys());

    // لو الملف المرفوع جاي برقم جلوس أو صف فاضي لطالب موجود بالفعل، منسيبش
    // القيمة الفاضية دي تمسح القيمة الصحيحة المخزّنة قبل كده — بنحافظ على
    // القديم ونحدّث بس لو فيه قيمة جديدة فعلية (حتى لو مختلفة عن القديمة).
    const studentRows = batch.map((r) => {
      const prev = existingMap.get(r.national_id);
      return {
        national_id: r.national_id,
        name: r.name_en ? (r.name + NAME_SEP + r.name_en) : r.name,
        seat_number: r.seat_number || (prev && prev.seat_number) || "",
        grade: r.grade || (prev && prev.grade) || "",
      };
    });
    const { data: upsertedStudents, error: studErr } = await supabaseClient
      .from("students").upsert(studentRows, { onConflict: "national_id" }).select("id, national_id");
    if (studErr) throw studErr;

    const idByNid = new Map(upsertedStudents.map((s) => [s.national_id, s.id]));

    const resultRows = batch.map((r) => ({
      student_id: idByNid.get(r.national_id), term_key: termKey,
      result_column1: r.result_column1, result_type: r.result_type,
      is_available: r.is_available, subjects: r.subjects, uploaded_file_id: fileId,
    }));
    const { error: resErr } = await supabaseClient
      .from("results").upsert(resultRows, { onConflict: "student_id,term_key" });
    if (resErr) throw resErr;

    batch.forEach((r) => { existingSet.has(r.national_id) ? updated++ : added++; });
  }
  return { added, updated };
}

// الدالة الرئيسية: رفع ملف واحد أو أكثر (حتى 20+ ملف) على Supabase لفترة محددة
async function uploadExcelFilesToSupabase(fileList, termKey, onProgress) {
  if (!supabaseClient) throw new Error("مكتبة Supabase لم يتم تحميلها");
  const files = Array.from(fileList);
  const results = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (onProgress) onProgress(i + 1, files.length, file.name);
    try {
      const records = await parseExcelRecords(file);

      const { data: logRow, error: logErr } = await supabaseClient
        .from("uploaded_files").insert({ file_name: file.name, term_key: termKey }).select("id").single();
      if (logErr) throw logErr;

      const { added, updated } = await pushRecordsToSupabase(records, termKey, logRow.id);

      await supabaseClient.from("uploaded_files")
        .update({ added_count: added, updated_count: updated }).eq("id", logRow.id);

      results.push({ file: file.name, added, updated, ok: true, cloudFileId: logRow.id });
    } catch (err) {
      console.error(`فشل رفع الملف ${file.name} للسحابة:`, err);
      results.push({ file: file.name, error: err.message || String(err), ok: false });
    }
  }
  return results;
}

// ---------- Storage layer ----------
// Switched from localStorage (~5-10MB limit, easy to exceed with many students/logos)
// to IndexedDB (much larger quota). Old localStorage data is migrated automatically once.
const IDB_NAME = "Shabab_Results_IDB";
const IDB_STORE = "kv";

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("المتصفح لا يدعم التخزين الموسّع (IndexedDB)")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE, { keyPath: "key" }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("تعذر فتح قاعدة البيانات المحلية"));
  });
}

function idbSet(key, value) {
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put({ key, value });
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error("فشل الكتابة في قاعدة البيانات المحلية"));
  }));
}

function idbGet(key) {
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error || new Error("فشل القراءة من قاعدة البيانات المحلية"));
  }));
}

async function saveDB() {
  try {
    await idbSet(DB_KEY, { students: studentsDB, files: uploadedFilesLog });
    await idbSet(SETTINGS_KEY, appSettings);
  } catch(e) {
    console.error("saveDB failed:", e);
    showToast("فشل حفظ البيانات: " + (e && e.message ? e.message : "خطأ غير معروف") + " — أعد المحاولة ولا تُغلق الصفحة قبل التأكد من ظهور رسالة الحفظ بنجاح", "err", 6000);
  }
}

async function loadDB() {
  try {
    let d = await idbGet(DB_KEY);
    let s = await idbGet(SETTINGS_KEY);

    // One-time migration from the old localStorage storage, if IndexedDB is still empty
    if (d === undefined) {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) { d = JSON.parse(raw); await idbSet(DB_KEY, d); }
      } catch(e) {}
    }
    if (s === undefined) {
      try {
        const sRaw = localStorage.getItem(SETTINGS_KEY);
        if (sRaw) { s = JSON.parse(sRaw); await idbSet(SETTINGS_KEY, s); }
      } catch(e) {}
    }

    if (d) { studentsDB = d.students || {}; uploadedFilesLog = d.files || []; }
    if (s) { appSettings = { ...appSettings, ...s }; }
  } catch(e) {
    console.error("loadDB failed:", e);
    showToast("تعذر تحميل البيانات المحفوظة: " + (e && e.message ? e.message : "خطأ غير معروف"), "err", 6000);
  }
  if (!studentsDB) studentsDB = {};
  if (!uploadedFilesLog) uploadedFilesLog = [];
  applySettingsToUI();

  // بعد إظهار النسخة المحفوظة محلياً فوراً (عشان الصفحة متبقاش فاضية لو
  // الإنترنت بطيء)، نجيب أحدث نسخة من الشعار واسم المدرسة من السحابة —
  // دي هي النسخة المشتركة بين كل الأجهزة، فبتكون لها الأولوية لو نجحت.
  try {
    const cloud = await fetchAppSettingsFromCloud();
    if (cloud) {
      appSettings = {
        ...appSettings,
        mainTitle: cloud.main_title || appSettings.mainTitle,
        subTitle: cloud.sub_title || appSettings.subTitle,
        kaabaLogo: cloud.kaaba_logo || "",
        schoolLogo: cloud.school_logo || "",
      };
      await idbSet(SETTINGS_KEY, appSettings);
      applySettingsToUI();
    }
  } catch (e) {
    console.error("cloud settings refresh failed:", e);
  }
}

function arNorm(str) {
  return String(str || "").replace(/[\u064B-\u065F\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim();
}
const HAS_ARABIC = /[\u0600-\u06FF]/;

/** الصف: «الصف الخامس الابتدائي (لغات)» → «Primary 5 (Languages)» */
function translateGradeEn(grade) {
  const raw = String(grade || "").trim();
  if (!raw) return "—";
  if (!HAS_ARABIC.test(raw)) return raw;
  const s = arNorm(raw);
  const sec = /لغات/.test(s) ? " (Languages)" : (/عربي/.test(s) ? " (Arabic)" : "");
  const stage = /ابتد/.test(s) ? "Primary" : /اعداد/.test(s) ? "Preparatory" : /ثانو/.test(s) ? "Secondary"
    : /روضه|حضانه|رياض الاطفال|تمهيد/.test(s) ? "KG" : "";
  const ORD = [["الاول", 1], ["اول", 1], ["الثاني", 2], ["ثاني", 2], ["الثالث", 3], ["ثالث", 3], ["الرابع", 4], ["رابع", 4], ["الخامس", 5], ["خامس", 5], ["السادس", 6], ["سادس", 6]];
  let n = 0;
  const d = s.match(/[1-6١-٦]/);
  if (d) n = Number(String(d[0]).replace(/[١-٦]/, (c) => c.charCodeAt(0) - 1632));
  if (!n) { for (const [k, v] of ORD) { if ((" " + s + " ").indexOf(" " + k + " ") !== -1) { n = v; break; } } }
  if (stage && n) return `${stage} ${n}${sec}`;
  if (stage) return `${stage}${sec}`;
  return raw;
}

function translateSubjectEn(name) {
  const raw = String(name || "").trim();
  if (!raw || !HAS_ARABIC.test(raw)) return raw;
  const s = arNorm(raw);
  for (const [re, en] of SUBJECT_EN_RULES) { if (re.test(s)) return en; }
  return raw;
}

function translateOutcomeEn(text) {
  const raw = String(text || "").trim();
  if (!raw || !HAS_ARABIC.test(raw)) return raw;
  const s = arNorm(raw);
  if (/التمنيات/.test(s)) return "With best wishes for success";
  const mt = s.match(/^(?:اخر|نهايه)\s*(?:ال)?عام\s*(.*)$/);
  if (mt) return "End of Year" + (mt[1] ? " " + mt[1] : "");
  const mh = s.match(/^نصف\s*(?:ال)?عام\s*(.*)$/);
  if (mh) return "Mid-Year" + (mh[1] ? " " + mh[1] : "");
  const m = s.match(/ناجح\s*و?\s*منقول(?:\s*(?:الي|الى)\s*(.+))?$/);
  if (m) return "Passed and promoted" + (m[1] ? " to " + translateGradeEn(m[1]) : "");
  const mp = s.match(/ناجح\s*و?\s*منقول\s*(?:الي|الى)?\s*(?:لل|ال|ل)?صف\s*(.+)$/);
  if (mp) return "Passed and promoted to " + translateGradeEn(mp[1]);
  if (/ناجح.*دور\s*ثان/.test(s)) return "Passed after the Second Round";
  const mr = s.match(/دور\s*ثان\s*(?:في|فى|فيي)?\s*(.*)$/);
  if (mr) {
    const subs = [];
    const re = /\(((?:[^()]|\([^()]*\))*)\)/g;
    let m;
    while ((m = re.exec(mr[1])) !== null) {
      const inner = m[1].trim();
      if (inner) subs.push(translateSubjectEn(inner));
    }
    return subs.length ? "Second Round in: " + subs.join(", ") : "Second Round";
  }
  if (/دور\s*ثان/.test(s)) return "Second Round";
  if (/راسب|رسوب/.test(s)) return "Failed";
  if (/ناجح|اجتاز/.test(s)) return "Passed";
  if (/مقبول/.test(s)) return "Acceptable";
  return raw;
}
function translateResultTypeEn(text) {
  const raw = String(text || "").trim();
  if (!raw || !HAS_ARABIC.test(raw)) return raw;
  const s = arNorm(raw);
  if (/سداد.*(مصروف|رسوم)|(مصروف|رسوم).*سداد/.test(s)) return "Please pay the remaining school fees to view the result.";
  if (/^غير\s*متاح/.test(s)) return "Not Available";
  if (/^متاح/.test(s)) return "Available";
  return raw;
}
function translateCellEn(text) {
  const raw = String(text == null ? "" : text).trim();
  // رمز لغة الطالب الثانية: f = فرنساوي ، g = ألماني
  if (/^f$/i.test(raw)) return "French";
  if (/^g$/i.test(raw)) return "German";
  if (HAS_ARABIC.test(raw) && /ناجح|دور\s*ثان|راسب|رسوب/.test(arNorm(raw)) && raw.length > 12) return translateOutcomeEn(raw);
  if (!raw || !HAS_ARABIC.test(raw)) return raw;
  const s = arNorm(raw);
  const MAP = [[/^اجتاز/, "Passed"], [/غير\s*مقرر/, "Not Required"], [/معفي|معفى/, "Exempt"], [/غائب|غياب/, "Absent"], [/حرمان/, "Barred"],
    [/^ممتاز/, "Excellent"], [/^جيد\s*جدا/, "Very Good"], [/^جيد/, "Good"], [/^مقبول/, "Acceptable"], [/^ضعيف/, "Weak"],
    [/^راسب/, "Failed"], [/^ناجح/, "Passed"]];
  for (const [re, en] of MAP) { if (re.test(s)) return en; }
  return raw;
}
/** الاسم الإنجليزي: من حقل مباشر أو من المفتاح المحجوز داخل subjects (قادم من عمود English Name) */
function getEnglishNameFromRow(row) {
  if (!row) return "";
  const direct = row.name_en || row.english_name || row.nameEn;
  if (direct) return String(direct).trim();
  const parts = String(row.name || "").split(NAME_SEP);
  if (parts.length > 1 && parts[1].trim()) return parts.slice(1).join(NAME_SEP).trim();
  let bag = row.subjects || row.allData || {};
  if (typeof bag === "string") { try { bag = JSON.parse(bag); } catch (e) { bag = {}; } }
  const v = bag && bag[NAME_EN_KEY];
  return v ? String(v).trim() : "";
}
function studentNameFor(row, en) {
  if (!en) return arabicNameOf(row);
  // لو الاسم الإنجليزي غير مكتوب نعرض الاسم العربي بدل ترك فراغ
  return getEnglishNameFromRow(row) || arabicNameOf(row);
}

function esc(str) {
  if (!str && str !== 0) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

/** تنظيف أخطاء الفاصلة العائمة مثل 77.600000000001 → 77.6 */
function formatNiceNumber(n, maxDecimals) {
  const d = (typeof maxDecimals === "number") ? maxDecimals : 2;
  if (typeof n !== "number" || !isFinite(n)) return "—";
  const factor = Math.pow(10, d);
  let rounded = Math.round((n + Number.EPSILON) * factor) / factor;
  if (Object.is(rounded, -0)) rounded = 0;
  // إزالة أصفار زائدة: 77.60 → 77.6 ، 80.00 → 80
  return String(parseFloat(rounded.toFixed(d)));
}

function parseCellValue(v) {
  if (v === undefined || v === null || v === "") return { display: "—", raw: "", type: "empty" };
  if (typeof v === "number" && isFinite(v)) {
    return { display: formatNiceNumber(v), raw: v, type: "number" };
  }
  let str = String(v).trim();
  // صيغة "565/600" أو "565 / 600"
  const ratio = str.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);
  if (ratio) {
    const raw = parseFloat(ratio[1]);
    const max = parseFloat(ratio[2]);
    if (isFinite(raw) && isFinite(max) && max > 0) {
      return {
        display: formatNiceNumber(raw) + "/" + formatNiceNumber(max),
        raw,
        type: "number",
        max,
      };
    }
  }
  let num = parseFloat(str);
  if (!isNaN(num) && isFinite(num) && /^-?\d+(\.\d+)?$/.test(str)) {
    return { display: formatNiceNumber(num), raw: num, type: "number" };
  }
  return { display: str, raw: str, type: "text" };
}

/** تطبيع قيمة مادة قادمة من السحابة أو الإكسيل إلى شكل موحّد */
function normalizeSubjectVal(val) {
  if (val == null || val === "") return { display: "—", raw: "", type: "empty" };
  if (typeof val === "number" && isFinite(val)) {
    return { display: formatNiceNumber(val), raw: val, type: "number" };
  }
  if (typeof val === "string") return parseCellValue(val);
  if (typeof val === "object") {
    if (val.type === "number" && typeof val.raw === "number" && isFinite(val.raw)) {
      const max = (typeof val.max === "number" && val.max > 0) ? val.max : undefined;
      const display = formatNiceNumber(val.raw);
      return max ? { ...val, display, max } : { ...val, display };
    }
    if (typeof val.raw === "number" && isFinite(val.raw)) {
      return {
        display: formatNiceNumber(val.raw),
        raw: val.raw,
        type: "number",
        max: (typeof val.max === "number" && val.max > 0) ? val.max : undefined,
        order: val.order,
      };
    }
    if (val.display != null) {
      const p = parseCellValue(val.display);
      if (typeof val.max === "number" && val.max > 0) p.max = val.max;
      if (typeof val.order === "number") p.order = val.order;
      return p;
    }
  }
  return parseCellValue(val);
}

// بعض المواد (خصوصًا اختبارات الشهر) تكون درجتها النهائية أقل من 100 (5 مثلاً
// بدل 100 في امتحان الفصل)، والإدارة بتكتب الدرجة النهائية داخل اسم عمود
// المادة نفسه بصيغ شائعة مثل: "الرياضيات (5)"، "الرياضيات (من 5)"، "الرياضيات/5".
// هذه الدالة تستخرج الدرجة النهائية من اسم العمود إن وُجدت، وإلا تُرجع null
// (وعندها تُستخدم 100 كافتراضي في مكان الاستخدام).
function extractSubjectMaxFromHeader(header) {
  const str = String(header || "").trim();
  const patterns = [
    /\(\s*(?:من\s*)?(\d+(?:\.\d+)?)\s*\)\s*$/, // "(5)" أو "(من 5)"
    /\/\s*(\d+(?:\.\d+)?)\s*$/,                  // "/5"
    /من\s*(\d+(?:\.\d+)?)\s*$/,                  // "من 5"
  ];
  for (const re of patterns) {
    const m = str.match(re);
    if (m) {
      const max = parseFloat(m[1]);
      if (max > 0) return max;
    }
  }
  return null;
}

// تصنيف نص نتيجة الفترة: نجاح (أخضر) / دور ثانٍ (أحمر) / محايد
function classifyResultOutcome(text) {
  const t = String(text || "").trim();
  if (!t) return { kind: "neutral", label: "" };
  const low = t.toLowerCase();
  // دور ثانٍ / رسوب — أحمر (يُفحص أولًا لأنه قد يحتوي كلمات مختلطة)
  if (/دور\s*ثان|دورثان|رسوب|راسب|لم\s*ينجح|لم\s*يجتز|إعادة|اعادة/.test(low)) {
    return { kind: "second", label: t };
  }
  // نجاح / منقول — أخضر
  if (/ناجح|نجاح|منقول|اجتاز|مقبول|passed|promoted/.test(low)) {
    return { kind: "pass", label: t };
  }
  return { kind: "neutral", label: t };
}

function getScoreClass(val) {
  if (val.type === "empty") return "score-empty";
  if (val.type === "number") {
    // نطبّع الدرجة كنسبة مئوية من درجتها النهائية الخاصة بها (val.max)، بدل
    // افتراض أن كل الدرجات من 100 دائمًا — لأن اختبارات الشهر مثلاً قد تكون
    // من 5 فقط.
    const max = (typeof val.max === "number" && val.max > 0) ? val.max : 100;
    const pct = (val.raw / max) * 100;
    // وفق معايير الابتدائي: ممتاز ≥85 | جيد جدا/جيد ≥65 | مقبول ≥50 | دون المستوى <50
    if (pct >= 85) return "score-high";
    if (pct >= 65) return "score-mid";
    if (pct >= 50) return "score-mid";
    return "score-low";
  }
  let low = val.display.toLowerCase();
  if (/اجتاز|ناجح|ممتاز/.test(low)) return "score-high";
  if (/راسب|fail/.test(low)) return "score-low";
  return "score-text";
}

function isTermVisibleForStudent(student, targetTermKey) {
  if (!student.terms || !student.terms[targetTermKey]) return false;
  let targetIndex = termHierarchy.indexOf(targetTermKey);
  if (targetIndex === -1) return false;
  // فترة أعلى (مثل الفصل الدراسي الأول) لو أصبحت "متاحة"، فهذا يعني تلقائياً
  // إتاحة كل الفترات السابقة لها في التسلسل (أكتوبر، نوفمبر)، حتى لو كانت
  // حالتها الفردية "غير متاح" في آخر ملف مرفوع لها — لأن دفع الفصل كامل
  // يشمل منطقياً مكوناته الشهرية السابقة.
  let highestAvailableIdx = -1;
  for (let i = 0; i < termHierarchy.length; i++) {
    let t = termHierarchy[i];
    if (student.terms[t] && student.terms[t].isAvailable) {
      highestAvailableIdx = i;
    }
  }
  return targetIndex <= highestAvailableIdx;
}

function applyStudentPhotoToPreview(dataUrl) {
  const img = document.getElementById("studentPhotoPreview");
  const frame = document.getElementById("reportPhotoFrame");
  const area = document.getElementById("reportPhotoArea");
  if (!img) return;
  if (dataUrl) {
    img.src = dataUrl;

    if (area) area.classList.add("has-photo");
