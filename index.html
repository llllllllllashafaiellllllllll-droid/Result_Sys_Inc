// يحفظ تعديلات نموذج الطالب: تحديث بسيط، أو دمج كامل لو الرقم القومي
// الجديد بيخص طالب تاني موجود بالفعل (تصادم أرقام).
async function saveStudentEdit(oldNid, ov) {
  const msgEl = ov.querySelector("#editStudentMsg");
  const newNid = String(ov.querySelector("#editNidInput").value || "").trim().replace(/[^0-9]/g, "");
  const newName = ov.querySelector("#editNameInput").value.trim();
  const newGrade = ov.querySelector("#editGradeInput").value.trim();
  const newSeat = ov.querySelector("#editSeatInput").value.trim();
  msgEl.textContent = "";

  if (newNid.length !== 14) {
    msgEl.textContent = "⚠️ الرقم القومي يجب أن يكون 14 رقمًا بالضبط، وإلا لن يقدر ولي الأمر يلاقي النتيجة بالبحث العام";
    return;
  }
  if (!newName) { msgEl.textContent = "⚠️ اسم الطالب مطلوب"; return; }

  const nidChanged = newNid !== oldNid;
  const collisionLocal = nidChanged ? studentsDB[newNid] : null;

  if (collisionLocal) {
    const proceed = confirm(
      `⚠️ الرقم القومي "${newNid}" مسجَّل بالفعل باسم "${collisionLocal.name}".\n\n` +
      `لو تابعت، هيتم دمج نتائج "${studentsDB[oldNid].name}" مع سجل "${collisionLocal.name}"، وحذف السجل المكرر.\n\n` +
      `هل أنت متأكد إنك عايز تدمج السجلين؟`
    );
    if (!proceed) return;
  }

  const saveBtn = ov.querySelector("#saveEditStudentBtn");
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الحفظ...';

  try {
    let conflictCount = 0;
    if (supabaseClient) {
      if (collisionLocal) {
        conflictCount = await mergeStudentsInCloud(oldNid, newNid, { name: newName, grade: newGrade, seat_number: newSeat });
      } else {
        await updateStudentInCloud(oldNid, { national_id: newNid, name: newName, grade: newGrade, seat_number: newSeat });
      }
    }

    const current = studentsDB[oldNid];
    if (collisionLocal) {
      // بيانات السجل الصحيح (collisionLocal) هي اللي تكسب عند أي تعارض في
      // نفس الفترة، وبيانات الطالب الشبح (current) بتتضاف بس للفترات
      // الناقصة عنده.
      collisionLocal.terms = { ...current.terms, ...collisionLocal.terms };
      collisionLocal.name = newName;
      collisionLocal.grade = newGrade;
      collisionLocal.seatNumber = newSeat;
      delete studentsDB[oldNid];
    } else {
      delete studentsDB[oldNid];
      current.nationalId = newNid;
      current.name = newName;
      current.grade = newGrade;
      current.seatNumber = newSeat;
      studentsDB[newNid] = current;
    }
    await saveDB();

    if (collisionLocal && conflictCount > 0) {
      showToast(`تم الدمج، لكن فيه ${conflictCount} فترة كانت مسجّلة في السجلين معًا واحتفظنا ببيانات السجل الأصلي لها — راجعها يدويًا لو محتاج`, "ok", 7000);
    } else {
      showToast(collisionLocal ? "تم دمج بيانات الطالبين بنجاح" : "تم حفظ التعديلات بنجاح", "ok");
    }
    ov.remove();
    showAdminPanel();
  } catch (err) {
    console.error("saveStudentEdit error:", err);
    msgEl.textContent = "⚠️ حصل خطأ أثناء الحفظ: " + (err && err.message ? err.message : "غير معروف");
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
  }
}

// تحديث بسيط لبيانات طالب واحد في Supabase، بما فيها الرقم القومي نفسه.
// الـ id الداخلي (UUID) بيفضل ثابت، فكل نتائجه المرتبطة به في جدول results
// تفضل مربوطة صح تلقائيًا من غير أي حاجة تانية.
async function updateStudentInCloud(oldNid, fields) {
  const { error } = await supabaseClient.from("students").update(fields).eq("national_id", oldNid);
  if (error) throw error;
}

// دمج طالب "شبح" (oldNid) مع سجل موجود بالفعل بنفس الرقم القومي الصحيح
// (newNid): بننقل نتائج الفترات غير المتعارضة لمعرّف الطالب الصحيح، ثم
// نحذف سجل الطالب الشبح لو مفيش نتائج متعارضة متبقية عليه. بترجع عدد
// الفترات المتعارضة (لو فيه) عشان تتراجع يدويًا.
async function mergeStudentsInCloud(oldNid, newNid, fields) {
  const { data: rows, error: selErr } = await supabaseClient
    .from("students").select("id, national_id").in("national_id", [oldNid, newNid]);
  if (selErr) throw selErr;
  const oldRow = rows.find(r => r.national_id === oldNid);
  const targetRow = rows.find(r => r.national_id === newNid);
  if (!oldRow || !targetRow) throw new Error("تعذّر العثور على أحد السجلين في قاعدة البيانات السحابية");

  const { data: targetResults, error: trErr } = await supabaseClient
    .from("results").select("term_key").eq("student_id", targetRow.id);
  if (trErr) throw trErr;
  const targetTermKeys = new Set((targetResults || []).map(r => r.term_key));

  const { data: oldResults, error: orErr } = await supabaseClient
    .from("results").select("id, term_key").eq("student_id", oldRow.id);
  if (orErr) throw orErr;

  const movable = (oldResults || []).filter(r => !targetTermKeys.has(r.term_key));
  if (movable.length) {
    const { error: updErr } = await supabaseClient
      .from("results").update({ student_id: targetRow.id }).in("id", movable.map(r => r.id));
    if (updErr) throw updErr;
  }

  const conflictCount = (oldResults || []).length - movable.length;
  if (conflictCount === 0) {
    const { error: delStudErr } = await supabaseClient.from("students").delete().eq("id", oldRow.id);
    if (delStudErr) throw delStudErr;
  }

  const { error: updStudErr } = await supabaseClient.from("students").update(fields).eq("id", targetRow.id);
  if (updStudErr) throw updStudErr;
  return conflictCount;
}

// تصدير كل بيانات فترة معينة كملف إكسل باسم نوع النتيجة
window.exportTermData = async function(term) {
  try { await ensureXlsxLoaded(); } catch(e) { showToast("تعذّر تحميل مكتبة Excel: " + (e && e.message ? e.message : ""), "err"); return; }
  const extraColsSet = new Set();
  Object.values(studentsDB).forEach(s => {
    const t = s.terms && s.terms[term];
    if (t && t.allData) Object.keys(t.allData).forEach(k => extraColsSet.add(k));
  });
  const extraCols = Array.from(extraColsSet);
  const headers = ["الرقم القومي", "الحالة", "الصف", "اسم الطالب", "رقم الجلوس", "نوع النتيجة", ...extraCols, "نتيجة"];
  const rows = [headers];

  Object.values(studentsDB).forEach(s => {
    const t = s.terms && s.terms[term];
    if (!t) return;
    const row = [
      s.nationalId || "",
      t.isAvailable ? "متاح" : "غير متاح",
      s.grade || "",
      s.name || "",
      s.seatNumber || "",
      t.resultType || ""
    ];
    extraCols.forEach(col => row.push(t.allData && t.allData[col] ? t.allData[col].display : ""));
    row.push(t.resultColumn1 || "");
    rows.push(row);
  });

  if (rows.length <= 1) {
    showToast("لا توجد بيانات لهذه الفترة للتصدير", "err");
    return;
  }

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "النتائج");
  XLSX.writeFile(wb, `${termNames[term] || term}.xlsx`);
};

// يحذف نتائج ملف مرفوع واحد بعينه من جدول results في Supabase (بالاعتماد
// على uploaded_file_id)، وسجل الملف نفسه من uploaded_files. بيرجّع قائمة
// الطلاب المتأثرين عشان نقدر نفحص لو بقوا من غير أي بيانات نهائيًا.
async function deleteUploadFromCloud(cloudFileId) {
  if (!supabaseClient || !cloudFileId) return [];
  const { data: rows, error: selErr } = await supabaseClient
    .from("results").select("student_id").eq("uploaded_file_id", cloudFileId);
  if (selErr) throw selErr;
  const studentIds = [...new Set((rows || []).map(r => r.student_id))];

  const { error: delResErr } = await supabaseClient.from("results").delete().eq("uploaded_file_id", cloudFileId);
  if (delResErr) throw delResErr;

  const { error: delFileErr } = await supabaseClient.from("uploaded_files").delete().eq("id", cloudFileId);
  if (delFileErr) throw delFileErr;

  return studentIds;
}

// يحذف كل نتائج فترة دراسية كاملة (من كل الملفات) من Supabase دفعة واحدة،
// وبيرجّع قائمة الطلاب المتأثرين.
async function deleteTermFromCloud(termKey) {
  if (!supabaseClient) return [];
  const { data: rows, error: selErr } = await supabaseClient
    .from("results").select("student_id").eq("term_key", termKey);
  if (selErr) throw selErr;
  const studentIds = [...new Set((rows || []).map(r => r.student_id))];

  const { error: delResErr } = await supabaseClient.from("results").delete().eq("term_key", termKey);
  if (delResErr) throw delResErr;

  const { error: delFilesErr } = await supabaseClient.from("uploaded_files").delete().eq("term_key", termKey);
  if (delFilesErr) throw delFilesErr;

  return studentIds;
}

// من قائمة معرّفات طلاب مرشّحة، بيحذف نهائيًا من جدول students أي طالب
// بقى من غير أي صف متبقي له في جدول results إطلاقًا (يعني بقى بلا أي
// بيانات في أي فترة) — بيرجّع عدد الطلاب المحذوفين فعليًا.
async function purgeStudentsWithNoResults(studentIds) {
  if (!supabaseClient || !studentIds.length) return 0;
  let purged = 0;
  for (const chunk of chunkArray(studentIds, 200)) {
    const { data: remaining, error } = await supabaseClient
      .from("results").select("student_id").in("student_id", chunk);
    if (error) throw error;
    const stillHas = new Set((remaining || []).map(r => r.student_id));
    const toDelete = chunk.filter(id => !stillHas.has(id));
    if (toDelete.length) {
      const { error: delErr } = await supabaseClient.from("students").delete().in("id", toDelete);
      if (delErr) throw delErr;
      purged += toDelete.length;
    }
  }
  return purged;
}

// حذف بيانات ملف مرفوع بعينه — محليًا وعلى السحابة معًا. لازم يحذف من
// السحابة أولًا لأنها هي مصدر البيانات اللي بيبحث فيه ولي الأمر فعليًا.
window.adminDeleteUpload = async function(uploadId) {
  const idx = uploadedFilesLog.findIndex(u => u.id === uploadId);
  if (idx === -1) return;
  const entry = uploadedFilesLog[idx];
  const termLabel = termNames[entry.term] || entry.term;
  if (!confirm(`هل أنت متأكد من حذف بيانات هذا الملف نهائيًا من الجهاز والسحابة معًا؟\n${entry.name}\nسيتم حذف بيانات "${termLabel}" لكل الطلاب المرتبطين بهذا الرفع.`)) return;

  const purgeCheck = document.getElementById("purgeEmptyStudentsCheck");
  const purge = purgeCheck ? purgeCheck.checked : true;

  try {
    let purgedCount = 0;
    if (entry.cloudFileId) {
      const studentIds = await deleteUploadFromCloud(entry.cloudFileId);
      if (purge && studentIds.length) purgedCount = await purgeStudentsWithNoResults(studentIds);
    } else if (supabaseClient) {
      showToast("تنبيه: هذا الملف اتسجل قبل ما يتربط برقم السحابة، فتم حذفه محليًا فقط — راجع بيانات السحابة يدويًا لو محتاج", "err", 7000);
    }

    (entry.studentIds || []).forEach(nid => {
      if (studentsDB[nid] && studentsDB[nid].terms) {
        delete studentsDB[nid].terms[entry.term];
        if (purge && Object.keys(studentsDB[nid].terms).length === 0) delete studentsDB[nid];
      }
    });
    uploadedFilesLog.splice(idx, 1);
    await saveDB();
    showToast(`تم حذف بيانات الملف بنجاح${purgedCount ? ` (وحذف ${purgedCount} طالب شبح بلا بيانات متبقية)` : ""}`, "err");
    showAdminPanel();
  } catch (err) {
    console.error("adminDeleteUpload error:", err);
    showToast("تعذّر حذف بيانات الملف من السحابة: " + (err && err.message ? err.message : "خطأ غير معروف"), "err", 6000);
  }
};

// حذف كل بيانات فترة دراسية كاملة (من كل الملفات المرفوعة لها) دفعة واحدة.
async function adminDeleteTermData() {
  const termKey = document.getElementById("deleteTermSelect").value;
  const termLabel = termNames[termKey] || termKey;
  const purgeCheck = document.getElementById("purgeEmptyStudentsCheck");
  const purge = purgeCheck ? purgeCheck.checked : true;

  if (!confirm(`⚠️ هل أنت متأكد من حذف كل بيانات فترة "${termLabel}" نهائيًا (من كل الملفات المرفوعة لها) من الجهاز والسحابة معًا؟ لا يمكن التراجع عن هذا الإجراء.`)) return;

  const btn = document.getElementById("deleteTermBtn");
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الحذف...'; }

  try {
    let purgedCount = 0;
    if (supabaseClient) {
      const studentIds = await deleteTermFromCloud(termKey);
      if (purge && studentIds.length) purgedCount = await purgeStudentsWithNoResults(studentIds);
    }

    Object.keys(studentsDB).forEach(nid => {
      if (studentsDB[nid].terms && studentsDB[nid].terms[termKey]) {
        delete studentsDB[nid].terms[termKey];
        if (purge && Object.keys(studentsDB[nid].terms).length === 0) delete studentsDB[nid];
      }
    });
    for (let i = uploadedFilesLog.length - 1; i >= 0; i--) {
      if (uploadedFilesLog[i].term === termKey) uploadedFilesLog.splice(i, 1);
    }
    await saveDB();
    showToast(`تم حذف كل بيانات فترة "${termLabel}" بنجاح${purgedCount ? ` (وحذف ${purgedCount} طالب شبح بلا بيانات متبقية)` : ""}`, "err", 5000);
    showAdminPanel();
  } catch (err) {
    console.error("adminDeleteTermData error:", err);
    showToast("تعذّر حذف بيانات الفترة من السحابة: " + (err && err.message ? err.message : "خطأ غير معروف"), "err", 6000);
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-trash"></i> حذف بيانات هذه الفترة بالكامل'; }
  }
}

function setTheme(dark) {
  document.body.classList.toggle("dark", dark);
  localStorage.setItem("theme", dark ? "dark" : "light");
  const icon = dark ? "fa-sun" : "fa-moon";
  document.querySelectorAll("#themeToggle, #themeToggle2").forEach(btn => btn.innerHTML = `<i class="fas ${icon}"></i>`);
}

document.getElementById("searchBtn").addEventListener("click", searchStudent);
document.getElementById("searchInput").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 14); });
document.getElementById("searchInput").addEventListener("keydown", e => { if(e.key==="Enter") searchStudent(); });

// تسلسل النقر على الشعارات (الشعار الأيمن ثم الأيسر خلال 3 ثوانٍ)
let lastRightClickTime = 0;
document.getElementById("rightEmblemBox").addEventListener("click", () => {
  lastRightClickTime = Date.now();
});

document.getElementById("leftEmblemBox").addEventListener("click", () => {
  const now = Date.now();
  // إذا تم النقر على الأيسر خلال 3 ثوانٍ بعد الأيمن
  if (lastRightClickTime && (now - lastRightClickTime < 3000)) {
    lastRightClickTime = 0; // إعادة تعيين
    promptAdminAuth();
  }
});

// اختصار لوحة المفاتيح المباشر Ctrl + M
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'm') {
    e.preventDefault();
    promptAdminAuth();
  }
});

document.querySelectorAll("#themeToggle, #themeToggle2").forEach(btn => btn.addEventListener("click", () => setTheme(!document.body.classList.contains("dark"))));

loadDB();
setTheme(localStorage.getItem("theme") === "dark");
